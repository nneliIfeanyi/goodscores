<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="description" content="GoodScores – Create termly exam questions for schools" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <title>GoodScores</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="css/tailwind.css" />
  <script src="assets/tinymce/tinymce.min.js"></script>
</head>
<body class="h-full bg-antique-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-200">

  <!-- Splash Screen -->
  <div id="splash" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-gradient-to-br from-primary-600 to-primary-800 text-white">
    <div class="w-20 h-20 mb-6 rounded-2xl overflow-hidden shadow-lg">
      <img src="assets/icons/icon-192.png" alt="GoodScores" class="w-full h-full object-cover" />
    </div>
    <h1 class="text-2xl font-bold tracking-tight">GoodScores</h1>
    <p class="mt-2 text-primary-100 text-sm">Termly Exam Questions Made Simple</p>
    <div class="mt-8 w-8 h-8 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
  </div>

  <!-- App Shell -->
  <div id="app" class="hidden min-h-full flex flex-col">

    <!-- Top Nav -->
    <header id="app-header" class="sticky top-0 z-40 bg-white/80 dark:bg-gray-900/80 backdrop-blur border-b border-gray-200 dark:border-gray-800">
      <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg overflow-hidden shadow-sm">
            <img src="assets/icons/favicon-32.png" alt="GoodScores" class="w-full h-full object-cover" />
          </div>
          <span class="font-semibold text-primary-700 dark:text-primary-400">GoodScores</span>
        </div>

        <div class="flex items-center gap-3">
          <!-- Video tutorials -->
          <button id="btn-tutorials" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 hover:text-primary-600 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-primary-400 transition" aria-label="Open video tutorials" title="Video tutorials">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 19h8a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </button>

          <!-- Install app -->
          <button id="btn-install" class="hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition" aria-label="Install GoodScores" title="Install GoodScores">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14a2 2 0 002-2v-3M3 16v3a2 2 0 002 2"/>
            </svg>
          </button>

          <!-- Theme toggle -->
          <button id="theme-toggle" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition" aria-label="Toggle theme">
            <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
            </svg>
            <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
          </button>

          <!-- Settings / Account -->
          <button id="btn-settings" class="hidden" aria-hidden="true" tabindex="-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 overflow-y-auto pb-20">
      <!-- Dynamic pages injected here -->
    </main>

    <!-- Bottom Navigation (max 5) -->
    <nav id="bottom-nav" class="fixed bottom-0 inset-x-0 z-40 bg-white/90 dark:bg-gray-900/90 backdrop-blur border-t border-gray-200 dark:border-gray-800 safe-bottom">
      <div class="max-w-3xl mx-auto grid h-16" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        <button data-page="dashboard" class="nav-item flex flex-col items-center justify-center gap-0.5 text-primary-600 dark:text-primary-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/>
          </svg>
          <span class="text-[10px] font-medium">Home</span>
        </button>
        <button data-page="questions" class="nav-item flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <span class="text-[10px] font-medium">Questions</span>
        </button>
        <button data-page="papers" class="nav-item flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
          </svg>
          <span class="text-[10px] font-medium">Papers</span>
        </button>
        <button data-page="diagrams" class="nav-item flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 19h16M5 16l4-10h1l4 10M8 12h4"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 8h4m0 0v4m0-4l-6 6"/>
          </svg>
          <span class="text-[10px] font-medium">Diagrams</span>
        </button>
        <button data-page="account" class="nav-item flex flex-col items-center justify-center gap-0.5 text-gray-500 dark:text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
          </svg>
          <span class="text-[10px] font-medium">Account</span>
        </button>
      </div>
    </nav>
  </div>

<script>
  window.GOODSCORES_API_BASE = ['localhost', '127.0.0.1'].includes(window.location.hostname)
    ? `http://${window.location.host}/goodscores/backend/public`
    : 'https://goodscores.leadstar.com.ng';
</script>
    <script>
      (() => {
          const savedTheme = localStorage.getItem('gs_theme') || 'light';
          document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        const revealApp = () => {
          document.getElementById('splash')?.classList.add('hidden');
          document.getElementById('app')?.classList.remove('hidden');
        };
        window.__goodscoresRevealApp = revealApp;
        window.setTimeout(revealApp, 5000);
      })();
    </script>
  <script type="module" src="js/app.js?v=29"></script>
</body>
</html>
